name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev

      - name: Bump version and update changelog
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          current_version="$(uv run cz version --project)"
          current_tag="v${current_version}"
          if ! git rev-parse --verify --quiet "refs/tags/${current_tag}" >/dev/null; then
            git tag "${current_tag}" "$(git rev-list --max-parents=0 HEAD)"
          fi
          uv run cz bump --changelog --yes
          echo "version=$(uv run cz version --project)" >> "$GITHUB_OUTPUT"

      - run: |
          git push
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes
