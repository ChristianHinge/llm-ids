[project]
name = "llm-ids"
version = "0.3.0"
description = "Encode data as token-efficient, LLM-friendly strings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christian Hinge", email = "christian.hinge@outlook.dk" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "tokenizer", "tiktoken", "id", "uid", "encoding"]

[dependency-groups]
dev = [
    "commitizen>=4.18.1",
    "huggingface-hub>=1.32.0",
    "pytest>=8",
    "tiktoken>=0.8",
    "tokenizers>=0.23.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
